name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  frontend:
    name: Frontend build (vue-tsc + vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: redbook-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: redbook-frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  backend:
    name: Backend build (mvn package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      # E2E 需要完整中间件与 Nacos 配置，不在 CI 跑；此处仅保证编译与打包
      - run: mvn -B -q package -DskipTests
