server:
  port: 8091
spring:
  application:
    name: redbook-service-ai
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000
deepseek:
  api_url: ${DEEPSEEK_API_URL:https://api.deepseek.com/v1}
  # 密钥一律走环境变量，不再提交到仓库（原 key 已泄露，请到 DeepSeek 后台吊销）
  api_key: ${DEEPSEEK_API_KEY:}
