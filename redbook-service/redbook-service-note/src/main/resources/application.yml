server:
  port: 8085
spring:
  application:
    name: redbook-service-note
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000
  cache:
    cache-names: noteCache
    caffeine:
      spec: maximumSize=500,expireAfterWrite=5m
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/rb_note?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:your_db_password}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:your_rabbitmq_password}
    virtual-host: /
  # Kafka 配置
  kafka:
    # Kafka 集群地址
    bootstrap-servers: ${KAFKA_ADDR:localhost:9092}
    # 消费者相关配置
    consumer:
      # 消费者组 ID
      group-id: redbook-note-consumer
      # 消费位点策略：latest 表示从最新位置开始
      auto-offset-reset: latest
      # 是否自动提交 offset，开启自动提交以减少处理延迟
      enable-auto-commit: true
      # Key 反序列化器
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Value 反序列化器
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    # 生产者相关配置
    producer:
      # 发送失败重试次数，设置为 0 以追求最快速
      retries: 0
      # 应答级别：0 表示不等待 broker 确认
      acks: 0
      # Key 序列化器
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Value 序列化器
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    # 监听容器配置
    listener:
      # 自动确认模式，减少处理开销
      ack-mode: RECORD
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:your_redis_password}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
    mongodb:
      host: ${MONGO_HOST:localhost}
      port: ${MONGO_PORT:27017}
      database: redbook
      username: ${MONGO_USERNAME:root}
      password: ${MONGO_PASSWORD:your_mongo_password}
      authentication-database: admin
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto
oss:
  endpoint: oss-cn-beijing.aliyuncs.com
  accessKeyId: ${OSS_ACCESS_KEY_ID:your-access-key-id}
  accessKeySecret: ${OSS_ACCESS_KEY_SECRET:your-access-key-secret}
  bucketName: ${OSS_BUCKET_NAME:your-bucket-name}
deepseek:
  api_url: https://api.deepseek.com/v1
  api_key: ${DEEPSEEK_API_KEY:your-deepseek-api-key}
# Embedding 向量化服务（用于 ES 混合检索 dense_vector 生成）
# 默认禁用，需通过环境变量 EMBEDDING_ENABLED=true 开启
embedding:
  enabled: ${EMBEDDING_ENABLED:false}
  api_url: ${EMBEDDING_API_URL:https://api.openai.com/v1}
  api_key: ${EMBEDDING_API_KEY:your-embedding-api-key}
  model: ${EMBEDDING_MODEL:text-embedding-v3}
map:
  key: your-gaode-map-key
geo:
  distance: 5
